<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PhraseSpin Demo</title>
  <link rel="stylesheet" href="./src/index.css" />
  <script type="module" src="/src/my-element.ts"></script>
</head>

<body>
  <my-element>
    <h1>Vite + Lit</h1>
    <!-- phrase-spin 使用範例：JSON 格式 -->
    <phrase-spin phrases='["Hello","世界","Lit 元件"]' animation="bounceIn" speed="1500"></phrase-spin>

    <!-- phrase-spin 使用範例：逗號分隔 -->
    <phrase-spin phrases="A,B,C,D" animation="bounceIn" speed="1000"></phrase-spin>
  </my-element>


  <script type="module" src="/src/components/phrase-spin.ts"></script>
</body>
